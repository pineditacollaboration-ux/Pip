const BG_ST = { f: 'all', t: 'all', o: 'def' };

const UNIT = { constructor: 'enlaces', 'red-completa': 'enlaces', popular: 'visitas', 'en-llamas': 'visitas', clicker: 'clics', fiel: 'días' };
const SING = { enlaces: 'enlace', visitas: 'visita', clics: 'clic', 'días': 'día' };
const falta = (b) => { const n = b.goal - b.progress, u = UNIT[b.id] || ''; return n === 1 ? `Te falta 1 ${SING[u] || u}`.trim() : `Te faltan ${n} ${u}`.trim(); };

function h(t, p, ...k) {
  const e = document.createElement(t);
  for (const [a, v] of Object.entries(p || {})) {
    if (a === 'class') e.className = v;
    else if (a === 'text') e.textContent = v;
    else if (a === 'html') e.innerHTML = v;
    else if (a === 'style') e.style.cssText = v;
    else if (a.startsWith('on') && typeof v === 'function') e[a] = v;
    else if (v !== false && v != null) e.setAttribute(a, v);
  }
  for (const c of k.flat()) if (c != null) e.append(c);
  return e;
}

function switchMobileView(viewName) {
  const app = $('app');
  if (!app) return;
  app.dataset.tab = viewName;
  $('tab_ed')?.setAttribute('aria-selected', String(viewName === 'editor'));
  $('tab_pv')?.setAttribute('aria-selected', String(viewName === 'preview'));
  if (viewName === 'preview') refresh(true);
}

async function api(p, m = 'GET', b) {
  const r = await fetch(p, {
    method: m,
    headers: { 'Content-Type': 'application/json' },
    body: b && JSON.stringify(b)
  });
  if (r.status === 401) {
    if (p === '/api/me') location.replace('/login');
    throw Object.assign(new Error('401'), { status: 401 });
  }
  const isJson = (r.headers.get('content-type') || '').includes('application/json');
  const d = isJson ? await r.json().catch(() => null) : null;
  if (!r.ok) throw new Error(d?.error || (r.status >= 500 ? 'Error del servidor. Inténtalo de nuevo.' : `Error HTTP ${r.status}`));
  if (!isJson) throw new Error('El servidor devolvió una respuesta inesperada.');
  return d;
}

const payload = () => ({ ...PF, settings: CFG });
let changeVersion = 0, saving = false;

/* ── Debounced touch: batches rapid input changes into a single preview fetch ── */
let pvDebTimer = null;
const DRAFT_KEY = 'pip_dashboard_draft_v1';
let draftTimer = null;
function rememberDraft() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => lsSet(DRAFT_KEY, JSON.stringify({ profile: PF, settings: CFG, savedAt: Date.now() })), 180);
}
function touch(immediate) {
  dirty = true;
  changeVersion++;
  rememberDraft();
  const sv = $('save');
  sv.disabled = saving;
  const txt = sv.querySelector('.sv-txt');
  if (txt && !saving) txt.textContent = 'Guardar cambios';
  if (immediate) { pvRun(); return; }
  clearTimeout(pvDebTimer);
  /* Enviar la última edición en el siguiente frame: el preview no espera una
     ventana de debounce perceptible, pero sigue agrupando eventos del teclado. */
  const since = Date.now() - (window._pvLast || 0);
  pvDebTimer = setTimeout(pvRun, since > 150 ? 0 : 150 - since);
}

/* Vista previa instantánea: sin retardo ni texto de estado.
   - La petición sale en el acto; si hay una en curso, la última edición espera y sale justo después (siempre gana la más reciente).
   - El nuevo render se carga en un iframe oculto y se intercambia al estar listo: la vista nunca parpadea ni se queda en blanco. */
let pvBusy = false, pvAgain = false, pvShown = false, pvAbort = null;
function pvSwap(front, back) {
  back.classList.remove('bk'); front.classList.add('bk');
  front.id = 'pv2'; back.id = 'pv';
}
async function pvRun() {
  if (pvBusy) {
    pvAgain = true;
    if (pvAbort) { try { pvAbort.abort(); } catch {} }
    return;
  }
  pvBusy = true;
  window._pvLast = Date.now();
  try {
    do {
      pvAgain = false;
      let html;
      try {
        if (pvAbort) { try { pvAbort.abort(); } catch {} }
        pvAbort = new AbortController();
        const r = await fetch('/api/preview', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload()),
          signal: pvAbort.signal
        });
        if (!r.ok) continue;
        html = await r.text();
      } catch (err) {
        if (err.name === 'AbortError') continue;
        continue;
      } finally {
        pvAbort = null;
      }
      const front = $('pv'), back = $('pv2');
      if (!pvShown) { front.srcdoc = html; pvShown = true; continue; }
      await new Promise((done) => {
        let ok = false;
        const fin = () => { if (ok) return; ok = true; back.onload = null; pvSwap(front, back); done(); };
        back.onload = fin;
        setTimeout(fin, 20);
        back.srcdoc = html;
      });
    } while (pvAgain);
  } finally { pvBusy = false; }
}
function refresh(immediate) { if (immediate) pvRun(); else { clearTimeout(pvDebTimer); const since = Date.now() - (window._pvLast || 0); pvDebTimer = setTimeout(pvRun, since > 150 ? 0 : 150 - since); } }

function applyMe(d) {
  ME = d;
  render();
}

const card = (t, s, ...b) => h('div', { class: 'cd' },
  t ? h('div', { class: 'ch' }, h('h2', { text: t }), s ? h('p', { text: s }) : null) : null,
  h('div', { class: 'cb' }, ...b)
);

function toggle(get, set, label = 'Ajuste') {
  const b = h('button', { class: 'tg', role: 'switch', 'aria-checked': String(!!get()), 'aria-label': label });
  b.onclick = () => {
    const v = !(b.getAttribute('aria-checked') === 'true');
    b.setAttribute('aria-checked', String(v));
    set(v);
    touch();
  };
  return b;
}

function ctl(i) {
  const v = CFG[i.k];
  if (i.t === 'toggle') {
    return h('div', { class: 'sw' },
      h('div', {}, h('b', { text: i.l }), i.desc ? h('small', { text: i.desc }) : null),
      toggle(() => CFG[i.k], x => CFG[i.k] = x, i.l)
    );
  }
  if (i.t === 'chips') {
    const w = h('div', {}, h('label', { class: 'l', text: i.l }));
    const c = h('div', { class: 'chips' });
    i.o.forEach(([val, lab]) => {
      const b = h('button', { class: 'chip', 'aria-pressed': String(CFG[i.k] === val), text: lab });
      b.onclick = () => {
        CFG[i.k] = val;
        [...c.children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        touch();
      };
      c.append(b);
    });
    w.append(c);
    return w;
  }
  if (i.t === 'range') {
    const o = h('span', { text: v });
    const r = h('input', { type: 'range', min: i.min, max: i.max, value: v, 'aria-label': i.l });
    const syncP = () => {
      const pct = Math.max(0, Math.min(100, Math.round(((+r.value - i.min) / (i.max - i.min)) * 100)));
      r.style.setProperty('--p', pct + '%');
    };
    syncP();
    r.oninput = () => { CFG[i.k] = +r.value; o.textContent = r.value; syncP(); touch(); console.log('DEBUG: Range changed', i.k, '=', CFG[i.k]); };
    return h('div', {},
      h('div', { class: 'fl' }, h('span', { text: i.l }), o),
      r,
      h('div', { class: 'rg' }, h('span', { text: i.lo || '' }), h('span', { text: i.hi || '' }))
    );
  }
  if (i.t === 'text' || i.t === 'date') {
    const c = h('input', { type: i.t === 'date' ? 'date' : 'text', value: v || '', maxlength: i.max || 80, placeholder: i.ph || '', 'aria-label': i.l });
    c.oninput = () => { CFG[i.k] = c.value; touch(); };
    return h('div', {}, h('label', { class: 'l', text: i.l }), c, i.desc ? h('small', { class: 'hint', text: i.desc }) : null);
  }
  if (i.t === 'color') {
    const c = h('input', { type: 'color', value: v, 'aria-label': i.l });
    c.oninput = () => { CFG[i.k] = c.value; touch(); };
    return h('div', {}, h('label', { class: 'l', text: i.l }), c);
  }
}


function saveFile(name, text, type) {

function uploader(kind, label, hint, url, thumbText, discordKey) {
  const vid = url && /\.(mp4|webm)$/.test(url);
  const th = h('div', { class: 'th', text: url ? (vid ? 'video' : '') : thumbText });
  if (url && !vid) th.style.backgroundImage = `url('${url}')`;
  const err = h('p', { class: 'err' });
  const fi = h('input', {
    type: 'file',
    hidden: true,
    accept: kind === 'background' ? 'image/*,video/mp4,video/webm' : 'image/png,image/jpeg,image/gif,image/webp'
  });
  const LIM = { avatar: 2, banner: 4 }[kind];
  const send = async (f) => {
    if (!f) return;
    err.textContent = '';
    if (LIM && f.size > LIM * 1048576) { err.textContent = `El archivo pesa ${(f.size / 1048576).toFixed(1)} MB y el máximo es ${LIM} MB.`; return; }
    if (kind !== 'background' && !/^image\/(png|jpeg|gif|webp)$/.test(f.type)) { err.textContent = 'Usa PNG, JPG, GIF o WEBP.'; return; }
    upEl.classList.add('busy');

        method: 'POST',
        headers: { 'x-pip': '1', 'Content-Type': 'application/octet-stream' },
        body: f
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      applyMe(d);
      refresh();
    } catch (x) {
      err.textContent = x.message;
    }
    fi.value = '';
    upEl.classList.remove('busy');
  };
  fi.onchange = () => send(fi.files[0]);
  const rm = h('button', {
    class: 'btn btn-ghost',
    text: 'Quitar',
    disabled: !url,
    onclick: async () => {
      try { applyMe(await api('/api/upload/' + kind, 'DELETE')); refresh(); }
      catch (x) { err.textContent = x.message; }
    }
  });
  const ds = discordKey && ME.user.discord && ME.user.discord[discordKey] ? h('button', {
    class: 'btn btn-ghost',
    text: 'Usar avatar de Discord',
    onclick: async () => {
      try { applyMe(await api('/api/discord/use/' + kind, 'POST', {})); refresh(); }
      catch (x) { err.textContent = x.message; }
    }
  }) : null;

  const upEl = h('div', { class: 'up', 'data-kind': kind },
    th,
    h('div', { class: 'tx' }, h('b', { text: label }), h('small', { text: hint + ' · o arrástralo aquí' })),
    h('button', { class: 'btn p', text: 'Subir archivo', onclick: () => fi.click() }),
    fi,
    rm
  );

  );

      'architect': '/insignia_arquitecto_128.webp',
      'developer': '/insignia_codigo_128.webp',
      'origin': '/insignia_origen_128.webp',
      'creative-director': '/insignia_pluma_128.webp',
      'first-release': '/insignia_primera_edicion_128.webp',

      const anim = BADGE_ANIM[b.id];

        class: 'em' + (off ? ' off' : ''),

        html: anim

        h('h3', { text: b.name }),
        h('span', { class: 'rar', 'data-r': b.style || b.tier, text: b.rarity }),
        h('h4', { text: 'Requisito de desbloqueo' }),
        h('p', { text: b.desc }),
        h('h4', { text: 'Tu progreso' }),

      else if (st.o === 'pro') L = [...L].sort((a, b) => (b.earned - a.earned) || ((b.goal ? b.progress / b.goal : 0) - (a.goal ? a.progress / a.goal : 0)));

        type: 'button',

          h('select', { class: 'bsel', 'aria-label': 'Filtrar por rareza', onchange: e => { st.t = e.target.value; draw(); } },

function spark(v) {

  const W = 200, H = 34, m = Math.max(...v), id = 'sp' + (++spN);
  const pts = v.map((c, i) => [i * W / (v.length - 1), H - 3 - (c / m) * (H - 8)]);
  const ln = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  return h('span', { class: 'sc-sp', html: `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" width="100%" height="100%" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F2F2" stop-opacity=".32"/><stop offset="1" stop-color="#F2F2F2" stop-opacity="0"/></linearGradient></defs><path d="${ln} L${W} ${H} L0 ${H}Z" fill="url(#${id})"/><path d="${ln}" fill="none" stroke="#F2F2F2" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>` });
}
/* cuenta ascendente (solo al entrar en una sección; el valor final siempre es exacto) */
function countUp(el, n) {

  const t0 = performance.now(), D = 800;
  const step = now => {
    const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 4);
    el.textContent = Math.round(n * e).toLocaleString('es');
    if (k < 1) requestAnimationFrame(step);
  };
  el.textContent = '0';
  requestAnimationFrame(step);
}

/* últimos 14 días SIN huecos (el servidor solo devuelve los días con visitas) */
function denseDays() {
  const by = new Map(ME.stats.days.map(d => [String(d.day).slice(0, 10), Number(d.count) || 0]));

function viewsControl() {
  const getCurrent = () => Number(ME?.stats?.views ?? 0);
  let mode = 'add';
  let review = false;
  const result = h('div', { class: 'vm-result' }, h('span', { text: 'Resultado' }), h('strong', { text: String(getCurrent()) }));
  const input = h('input', { type: 'text', inputmode: 'numeric', class: 'inp vm-input', value: '', placeholder: '1000', 'aria-label': 'Ajustar contador' });
  const error = h('p', { class: 'vm-error', role: 'alert', text: '' });
  const reviewBox = h('div', { class: 'vm-review', hidden: true }, h('div', { class: 'vm-review-inner' },
    h('strong', { text: 'Revisa el ajuste antes de guardar' }),
    h('div', { class: 'vm-actions' },
      h('button', { type: 'button', class: 'btn btn-ghost', text: 'Cancelar' }),
      h('button', { type: 'button', class: 'btn btn-primary', text: 'Confirmar' }))))
  const submit = h('button', { type: 'button', class: 'vm-submit', disabled: true, text: 'Revisar ajuste' });

  const syncDisplay = () => {
    const current = getCurrent();
    const raw = String(input.value || '').trim();
    const parsed = Number.parseInt(raw.replace(/\D/g, ''), 10) || 0;
    const valid = raw !== '' && /^\d+$/.test(raw) && Number.isInteger(parsed) && parsed > 0 && parsed <= 10000000;
    if (!valid) {
      submit.disabled = true;
      result.querySelector('strong').textContent = String(current);
      return null;
    }
    const target = mode === 'total' ? parsed : current + parsed;
    const isValid = mode === 'total' ? parsed > current : true;
    submit.disabled = !isValid;
    result.querySelector('strong').textContent = String(target);
    error.textContent = '';
    return isValid ? target : null;
  };

  const setMode = (next) => {
    mode = next;
    const current = getCurrent();
    const raw = Number.parseInt(String(input.value || '').replace(/\D/g, ''), 10) || 0;
    if (next === 'total' && raw > 0) input.value = String(current + raw);
    if (next === 'add' && raw > current) input.value = String(raw - current);
    document.querySelectorAll('[data-mode]').forEach((el) => el.setAttribute('aria-pressed', String(el.dataset.mode === next)));
    syncDisplay();
  };

  const computeTarget = () => {
    const current = getCurrent();
    const raw = String(input.value || '').trim();
    const parsed = Number.parseInt(raw.replace(/\D/g, ''), 10) || 0;
    if (!/^\d+$/.test(raw) || raw === '') return null;
    if (!Number.isInteger(parsed) || parsed <= 0 || parsed > 10000000) return null;
    if (mode === 'total') return parsed > current ? parsed : null;
    return current + parsed;
  };

  input.addEventListener('input', () => {
    syncDisplay();
  });

  submit.addEventListener('click', async () => {
    if (submit.disabled) return;
    if (!review) {
      review = true;
      reviewBox.hidden = false;
      return;
    }
    const expected = Number(ME?.stats?.views ?? 0);
    const target = computeTarget();
    if (target === null) return;
    submit.disabled = true;
    submit.textContent = 'Guardando…';
    try {
      const body = { expected, target };
      const r = await api('/api/admin/set-views', 'POST', body);
      if (r?.views != null) ME.stats.views = Number(r.views);
      review = false;
      reviewBox.hidden = true;
      submit.textContent = 'Revisar ajuste';
      submit.disabled = true;
      input.value = '';
      result.querySelector('strong').textContent = String(getCurrent());
      if (typeof refresh === 'function') refresh();
    } catch (err) {
      review = false;
      reviewBox.hidden = true;
      submit.textContent = 'Revisar ajuste';
      submit.disabled = false;
      input.disabled = false;
      error.textContent = err?.message || 'Error al guardar';
      result.querySelector('strong').textContent = String(getCurrent());
    }
  });

  const cancel = reviewBox.querySelector('.btn-ghost');
  cancel.addEventListener('click', () => {
    review = false;
    reviewBox.hidden = true;
    input.value = '';
    error.textContent = '';
    submit.disabled = true;
    result.querySelector('strong').textContent = String(getCurrent());
  });

  const modes = h('div', { class: 'vm-modes' },
    h('button', { type: 'button', class: 'vm-mode', 'data-mode': 'add', 'aria-pressed': 'true', text: 'Sumar' }),
    h('button', { type: 'button', class: 'vm-mode', 'data-mode': 'total', text: 'Total' }));
  modes.querySelector('[data-mode="add"]').addEventListener('click', () => setMode('add'));
  modes.querySelector('[data-mode="total"]').addEventListener('click', () => setMode('total'));
  const root = h('div', { class: 'vm-control' }, h('div', { class: 'vm-row' }, modes, result), h('div', { class: 'vm-row' }, input, submit), reviewBox, error);
  return root;
}

    if (!tip) { tip = document.createElement('div'); tip.className = 'ac-tip'; box.append(tip); }
    const [d, v] = circles[k].querySelector('title').textContent.split(': ');
    tip.innerHTML = `<small>${d}</small><b>${v}</b>`;
    const br = box.getBoundingClientRect();
    tip.style.left = (cr.left + cr.width / 2 - br.left) + 'px';
    tip.style.top = (cr.top - br.top) + 'px';
  });
});

/* Quick Command Palette (Ctrl/⌘+K) */
(() => {
  const dlg = h('dialog', { class: 'cmd', 'aria-label': 'Menú de comandos rápidos' });
  const inp = h('input', { type: 'text', placeholder: 'Buscar sección o acción rápida… (ej. Enlaces, Fondo, Guardar)', 'aria-label': 'Buscar comando', autocomplete: 'off' });
  const list = h('div', { role: 'listbox' });
  const hint = h('div', { class: 'cmd-hint', 'aria-hidden': 'true' },
    h('span', {}, h('kbd', { text: '↑↓' }), 'Navegar'), h('span', {}, h('kbd', { text: '↵' }), 'Abrir'), h('span', {}, h('kbd', { text: 'Esc' }), 'Cerrar'));
  dlg.append(inp, list, hint);
  document.body.append(dlg);
  let items = [], sel = 0;

  const cmds = () => [
    ...NAV.filter(n => n.length > 1).map(([k, l]) => ({ l: `Ir a ${l}`, i: ICONS[NAV_METAS[k]?.icon], f: () => go_(k) })),
    { l: 'Copiar enlace de mi perfil público', i: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>', f: () => copyLink() },
    { l: 'Actualizar métricas ahora', i: SC_ICON.trend, f: () => syncStats(true) },
    { l: 'Copiar informe de estadísticas', i: SC_ICON.bulb, f: () => navigator.clipboard.writeText(reportText()) },
    { l: 'Descargar métricas en CSV', i: SC_ICON.arrow, f: () => exportCsv() },
    { l: 'Mostrar visitas de los últimos 7 días', i: SC_ICON.calendar, f: () => { RANGE = 7; go_('estadisticas'); } },
    { l: 'Mostrar visitas de los últimos 14 días', i: SC_ICON.calendar, f: () => { RANGE = 14; go_('estadisticas'); } },
    { l: 'Generar código QR de mi perfil', i: SC_ICON.target, f: () => go_('compartir') },
    { l: 'Abrir mi perfil en una nueva pestaña', i: '<path d="M7 17 17 7M8 7h9v9"/>', f: () => window.open('/' + ME.user.username, '_blank', 'noopener') },
    ...($('save').disabled ? [] : [{ l: 'Guardar cambios pendientes', i: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', f: () => $('save').click() }])
  ];

  const draw = () => {
    const q = inp.value.trim().toLowerCase();
    items = cmds().filter(c => c.l.toLowerCase().includes(q));
    sel = Math.min(sel, Math.max(0, items.length - 1));
    list.replaceChildren(...(items.length ? items.map((c, i) => h('button', {
      type: 'button',
      role: 'option',
      'aria-selected': String(i === sel),
      onclick: () => run(i)
    }, h('span', { class: 'cmd-ic', html: `<svg viewBox="0 0 24 24" aria-hidden="true">${c.i || ''}</svg>` }), h('span', { text: c.l }),
      i === sel ? h('kbd', { text: '↵' }) : null)) : [h('p', { text: 'Sin resultados para la búsqueda.' })]));
  };

  const run = i => {
    const c = items[i];
    if (!c) return;
    dlg.close();
    c.f();
  };

  inp.oninput = () => { sel = 0; draw(); };
  inp.onkeydown = e => {
    if (e.key === 'ArrowDown') { sel = Math.min(items.length - 1, sel + 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); }
    else if (e.key === 'Enter') run(sel);
  };
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && typeof ME !== 'undefined' && ME) {
      e.preventDefault();
      inp.value = '';
      sel = 0;
      draw();
      if (!dlg.open) dlg.showModal();
      inp.focus();
    }
  });
})();

  else if (k === 'g') gArm = Date.now();
});

  }

<script>
/* relleno del slider (--p) — MutationObserver acotado al área de ajustes */
(()=>{
  const setP=r=>{const mn=+r.min||0,mx=+r.max||100;r.style.setProperty('--p',((+r.value-mn)/(mx-mn||1)*100)+'%')};
  document.addEventListener('input',e=>{if(e.target.type==='range')setP(e.target)});
  /* Only scan newly-added nodes instead of every node under body */
  const obs=new MutationObserver(muts=>{
    muts.forEach(m=>m.addedNodes.forEach(n=>{
      if(n.nodeType!==1)return;
      if(n.matches?.('input[type=range]'))setP(n);
      n.querySelectorAll?.('input[type=range]').forEach(setP);
    }));
  });
  const view=document.getElementById('view');
  if(view)obs.observe(view,{childList:true,subtree:true});
  document.querySelectorAll('input[type=range]').forEach(setP);
})();
</script>
